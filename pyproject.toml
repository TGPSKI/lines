[project]
name = "mqsim"
version = "0.1.0"
description = "mqsim — compare merge-queue policies against glab_api, a fake GitLab server"
requires-python = "==3.12.*"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "pyyaml>=6.0",
    "click>=7.0,<9.0",
    "pydantic>=2.0",
    "python-gitlab>=4.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "httpx>=0.24",
    "pytest-asyncio>=1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mqsim", "src/glab_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

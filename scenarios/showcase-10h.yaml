metadata:
  name: Showcase 10h Queue (Synthetic)
  description: Fabricated merge queue over a 24-hour horizon, usually run for the
    first 10 hours. 108 merge requests across 23 tenant services, mixed priorities,
    peak-centred arrivals.
  provenance: Fully fabricated for this repository; not derived from operational logs.
  arrival_shape_note: >-
    The diurnal shape below is a fitted target, not a measurement. No observed
    values are retained. To build a scenario from your own logs, use
    scripts/calibrate_from_housekeeping_logs.py -- see docs/logs-to-scenario.md.
  scenario_kind: synthetic
  seed: 1307
  duration_ticks: 2880
  merge_request_count: 108
  domain_count: 36
  calibration_targets:
    knobs:
      tick_seconds_override: 30
      arrival_skew: 1.0
      queue_depth_scale: 0.95
    arrival_profile:
      model: fitted-diurnal
      scenario_start_hour: 13
      peak_window_hours_utc:
      - '13'
      - '14'
      - '15'
      - '16'
      - '17'
      - '18'
      - '19'
      - '20'
      peak_offpeak_ratio: 1.65
      hour_dispersion_cv: 0.41
      hour_dispersion_shape: 3.2
tick_seconds: 30

[project]
name = "mqsim"
version = "0.1.0"
description = "mqsim — compare merge-queue policies against glab_api, a fake GitLab server"
requires-python = "==3.14.*"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "pyyaml>=6.0",
    "click>=7.0,<9.0",
    "pydantic>=2.0",
    "python-gitlab>=4.0",
    "requests>=2.28",
]

[project.optional-dependencies]
# Harness mode only. The integration under test is imported into this process,
# so it installs into the same interpreter. No usable tag exists — the newest,
# 0.10.1 (2024-12-10), has no gitlab_housekeeping.py — so the pin is a commit,
# and qontract-reconcile is not on PyPI.
harness = [
    "qontract-reconcile @ git+https://github.com/app-sre/qontract-reconcile@5d6cf917ab73472068ff746196f13c5e52662508",
    # Two of its dependencies are uv workspace members of that same repo. uv
    # resolves them from the checkout; pip would take the unrelated packages
    # of those names from PyPI, whose pins do not resolve against upstream's.
    "qontract-utils @ git+https://github.com/app-sre/qontract-reconcile@5d6cf917ab73472068ff746196f13c5e52662508#subdirectory=qontract_utils",
    "qontract-api-client @ git+https://github.com/app-sre/qontract-reconcile@5d6cf917ab73472068ff746196f13c5e52662508#subdirectory=qontract_api_client",
]
dev = [
    "pytest>=9.0",
    "httpx>=0.24",
    "pytest-asyncio>=1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The harness extra pins qontract-reconcile by commit; it is not on PyPI.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mqsim", "src/glab_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "scripts"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
